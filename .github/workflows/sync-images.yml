name: Dump immagini packprint

# Avvio manuale, una tantum: tab "Actions" -> "Dump immagini packprint" -> "Run workflow"
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica le immagini
        env:
          # Opzionali: rendono funzionanti anche Instagram e Facebook
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python sync_images.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images manifest.json
          if git diff --cached --quiet; then
            echo "Nessuna nuova immagine da salvare."
          else
            git commit -m "Dump immagini packprint [skip ci]"
            git push
          fi
